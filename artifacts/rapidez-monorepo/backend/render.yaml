services:
  - type: web
    name: rapidez-carora-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_WHATSAPP
        sync: false
      - key: EXCHANGE_RATE_VES
        value: "50"
      - key: BASE_FARE_USD
        value: "1"
      - key: PER_KM_USD
        value: "0.40"
      - key: MIN_FARE_USD
        value: "1"
